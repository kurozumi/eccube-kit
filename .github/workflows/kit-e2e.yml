# キットを最初から最後まで通して試す（.github/scripts/kit-e2e.sh）。
# 系列（4.2・4.3・4.4）× DB（MariaDB・PostgreSQL）の 6 組で、
#   init → ページが開く → security.sh check → backup → DB を変えて restore（戻ったか）→ 同じ系列で upgrade → ページ → doctor
# を流す。**自動で更新を取り込む（自動マージする）ための土台。** ここが通らない変更は、人が見ても通さない。
#
# いつ流すか:
#   - キットの動きに関わるファイルを変える PR
#   - 毎週月曜 06:00 JST（build-image が全部を焼き直した朝のあと。焼き直したイメージで通るか）
#   - 手動
# 落ちたら、コンテナの状態とログを成果物に残す（使い捨ての環境なので、秘密は入っていても使い捨て）。
name: kit-e2e

on:
  pull_request:
    paths:
      - "bin/**"
      - "docker/**"
      - "compose*.yaml"
      - "app/config/eccube/**"
      - ".env.example"
      - ".github/scripts/kit-e2e.sh"
      - ".github/workflows/kit-e2e.yml"
  schedule:
    - cron: "0 21 * * 0"   # 月曜 06:00 JST
  workflow_dispatch:

concurrency:
  group: kit-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        series: ["4.2", "4.3", "4.4"]
        engine: ["mysql", "postgresql"]
    name: e2e (${{ matrix.series }} / ${{ matrix.engine }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 通して試す
        env:
          E2E_IMAGE_REPO: ${{ github.repository }}
        run: .github/scripts/kit-e2e.sh "${{ matrix.series }}" "${{ matrix.engine }}"

      - name: 落ちたときの控え
        if: failure()
        run: |
          mkdir -p e2e-logs
          docker compose ps -a > e2e-logs/ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps > e2e-logs/compose.log 2>&1 || true
          docker compose cp ec-cube:/var/www/html/var/log e2e-logs/eccube-log >/dev/null 2>&1 || true
          ls -la backups var/upgrade > e2e-logs/files.txt 2>&1 || true

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.series }}-${{ matrix.engine }}
          path: e2e-logs
          retention-days: 7
